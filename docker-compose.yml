services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "timezone=Europe/Berlin"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: helthtw
      POSTGRES_PASSWORD: helthtw
      POSTGRES_DB: helthtw
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
