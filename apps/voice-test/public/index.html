<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice test client</title>
    <style>
      body {
        font:
          16px system-ui,
          sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      #transcript {
        border: 1px solid #8884;
        border-radius: 8px;
        min-height: 12rem;
        max-height: 24rem;
        overflow-y: auto;
        padding: 0.5rem 1rem;
        margin-top: 1rem;
      }
      p {
        margin: 0.4rem 0;
      }
      .user {
        text-align: right;
      }
      .user::before {
        content: "You: ";
        opacity: 0.6;
      }
      .agent::before {
        content: "Agent: ";
        opacity: 0.6;
      }
      .interim {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <h1>Voice test client</h1>
    <p><strong>Only invented scenarios.</strong> No real names, no real health data.</p>
    <button id="toggle">Connect</button> <span id="status">disconnected</span>
    <div id="transcript"></div>
    <audio id="remote-audio" autoplay></audio>
    <script type="module" src="/app.js"></script>
  </body>
</html>
