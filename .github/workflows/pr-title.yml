name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

jobs:
  title:
    runs-on: ubuntu-26.04
    steps:
      - env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)\([a-z0-9-]+\)!?: .+'; then
            echo "Der PR-Titel soll dem Conventional-Commits-Standard entsprechen. Bitte passe ihn so an (z. B.): '<typ>(<bereich>): <beschreibung>'"
            echo "Mögliche Typen sind: feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert"
            exit 1
          fi
