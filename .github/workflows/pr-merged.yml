name: PR merged

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  board:
    if: ${{ github.event.pull_request.merged && !startsWith(github.head_ref, 'doku/') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
      - id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Move ticket to PO Abnahme
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          issue=$(echo "$BRANCH" | sed -nE 's#^(feature|hotfix|bug)/([0-9]+)$#\2#p')
          if [ -z "$issue" ]; then
            echo "::error::Der Branch '$BRANCH' muss feature|hotfix|bug/<ticket> heißen"
            exit 1
          fi
          echo "ISSUE=$issue" >> "$GITHUB_ENV"
          .github/scripts/move-ticket.sh "$issue" "PO Abnahme"

      - name: Close ticket
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          approvers=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" \
            --jq '[.[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED")]
              | group_by(.user.login) | map(last | select(.state == "APPROVED") | "@" + .user.login) | join(", ")')
          # "Closes #<ticket>" may have closed it already, and gh issue close then skips the comment.
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Gemergt mit #$PR, approved von: ${approvers:-niemandem}"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
